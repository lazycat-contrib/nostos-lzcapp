application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:1a2b8c783eb09ff2bb6a5c4123e74d6384251f763753be4b15e2b991d68f5c5a
    image: ghcr.io/christian-gennari/nostos:latest@sha256:1a2b8c783eb09ff2bb6a5c4123e74d6384251f763753be4b15e2b991d68f5c5a
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
