application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:b43f552f63e2445316499fbfa4a3be3027118e317c9f5cf3d2e8fe4edc581ac3
    image: ghcr.io/christian-gennari/nostos:latest@sha256:b43f552f63e2445316499fbfa4a3be3027118e317c9f5cf3d2e8fe4edc581ac3
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
