application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:86e07d6fc52c6e5e1561da2fd2effb5b109c076e1703fc036cf2d44362037880
    image: ghcr.io/christian-gennari/nostos:latest@sha256:86e07d6fc52c6e5e1561da2fd2effb5b109c076e1703fc036cf2d44362037880
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
