application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:b36d60313f41d1c7c4642a1d8300cec21a6701171642c4668dfe1bff587a0f18
    image: ghcr.io/christian-gennari/nostos:latest@sha256:b36d60313f41d1c7c4642a1d8300cec21a6701171642c4668dfe1bff587a0f18
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
