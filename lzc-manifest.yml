application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:96914a4b60e90438829fcf1aca66ea701f68124fff07bad29ae9f8bb8cb5c69e
    image: ghcr.io/christian-gennari/nostos:latest@sha256:96914a4b60e90438829fcf1aca66ea701f68124fff07bad29ae9f8bb8cb5c69e
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
