application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:0c3ca2899c0921f3629acb3b590c840d3b96561830e5fa3ba02fa4729efbbdd4
    image: ghcr.io/christian-gennari/nostos:latest@sha256:0c3ca2899c0921f3629acb3b590c840d3b96561830e5fa3ba02fa4729efbbdd4
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
