application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:661cc7bb2296a78d2116212aac783c14d65cf8256952f6204ec7fed0a70adbf9
    image: ghcr.io/christian-gennari/nostos:latest@sha256:661cc7bb2296a78d2116212aac783c14d65cf8256952f6204ec7fed0a70adbf9
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
