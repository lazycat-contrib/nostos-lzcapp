application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:805340f8f1d4b2969990e385c81284cf0bf3a6d83fea2e7a065c99024bccf772
    image: ghcr.io/christian-gennari/nostos:latest@sha256:805340f8f1d4b2969990e385c81284cf0bf3a6d83fea2e7a065c99024bccf772
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
