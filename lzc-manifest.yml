application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:ef55a227abf03d7e5e8e3256fb90422e12bccabafb2561e933829fba3c29d32d
    image: ghcr.io/christian-gennari/nostos:latest@sha256:ef55a227abf03d7e5e8e3256fb90422e12bccabafb2561e933829fba3c29d32d
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
