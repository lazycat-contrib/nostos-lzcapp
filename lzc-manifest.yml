application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:93e3884bfbd0da4a9cbebcae8ccdeb05dfa7a37d186b60545ded13fbfe67d14f
    image: ghcr.io/christian-gennari/nostos:latest@sha256:93e3884bfbd0da4a9cbebcae8ccdeb05dfa7a37d186b60545ded13fbfe67d14f
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
