application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:97814a25e7f60eb9d9e1c06dc0bd683053086d289708d7403423812943a8942d
    image: ghcr.io/christian-gennari/nostos:latest@sha256:97814a25e7f60eb9d9e1c06dc0bd683053086d289708d7403423812943a8942d
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
