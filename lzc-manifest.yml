application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:b0721102552912cd89afa8c284f60b84a26b7712be5b30dd26d4584b113e1d41
    image: ghcr.io/christian-gennari/nostos:latest@sha256:b0721102552912cd89afa8c284f60b84a26b7712be5b30dd26d4584b113e1d41
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
