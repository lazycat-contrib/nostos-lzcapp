application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:009ded37f193154e54293a3152800bb4996ff83de88bf7b4f70eabfb5a38b5b2
    image: ghcr.io/christian-gennari/nostos:latest@sha256:009ded37f193154e54293a3152800bb4996ff83de88bf7b4f70eabfb5a38b5b2
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
