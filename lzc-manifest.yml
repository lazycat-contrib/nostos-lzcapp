application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:9136c6f60941b0d098f7e1525d357971a55982782ee0faae78185cee8c303436
    image: ghcr.io/christian-gennari/nostos:latest@sha256:9136c6f60941b0d098f7e1525d357971a55982782ee0faae78185cee8c303436
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
