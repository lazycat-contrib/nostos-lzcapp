application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:84ef1fed1133c25afb0efaefbdff6f372c40b49f01de0b2a70c5ff96ad9ef592
    image: ghcr.io/christian-gennari/nostos:latest@sha256:84ef1fed1133c25afb0efaefbdff6f372c40b49f01de0b2a70c5ff96ad9ef592
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
