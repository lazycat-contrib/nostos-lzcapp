application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:5b6bc0f644415489cf5f047e15c224cc8c80f4c95ba9d413df4ac6a5797f9dde
    image: ghcr.io/christian-gennari/nostos:latest@sha256:5b6bc0f644415489cf5f047e15c224cc8c80f4c95ba9d413df4ac6a5797f9dde
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
