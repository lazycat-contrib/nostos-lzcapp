application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:d67b9a3c2139b9f1a54a0e8029a1d9219b3dbaceac5a2498a2fbb6b9e1c9910a
    image: ghcr.io/christian-gennari/nostos:latest@sha256:d67b9a3c2139b9f1a54a0e8029a1d9219b3dbaceac5a2498a2fbb6b9e1c9910a
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
