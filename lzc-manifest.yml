application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:99bbb48cfd77cfa9c0bfb9b4145bb5a98416b69325e426e42a0a89f843b124b0
    image: ghcr.io/christian-gennari/nostos:latest@sha256:99bbb48cfd77cfa9c0bfb9b4145bb5a98416b69325e426e42a0a89f843b124b0
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
