application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:77794b1d28a6bba5b2da59d2a6ce7e59c2eec6e6710edc5e88aa97cdf369d911
    image: ghcr.io/christian-gennari/nostos:latest@sha256:77794b1d28a6bba5b2da59d2a6ce7e59c2eec6e6710edc5e88aa97cdf369d911
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
