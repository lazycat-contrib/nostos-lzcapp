application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:76cbe2fa16077db825cd295eaf3b0c2af14a0e9838e88fcb1d59cca93eb77f14
    image: ghcr.io/christian-gennari/nostos:latest@sha256:76cbe2fa16077db825cd295eaf3b0c2af14a0e9838e88fcb1d59cca93eb77f14
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
