application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:3734e41f2c6deb9ae2a5e88a4241ed3d7d3ddbddf568b184a68559eb86209764
    image: ghcr.io/christian-gennari/nostos:latest@sha256:3734e41f2c6deb9ae2a5e88a4241ed3d7d3ddbddf568b184a68559eb86209764
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
