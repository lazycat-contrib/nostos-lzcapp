application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:6c75d445df6575061bff739a703bf355943dda940eac3399540a1ab342c7f55f
    image: ghcr.io/christian-gennari/nostos:latest@sha256:6c75d445df6575061bff739a703bf355943dda940eac3399540a1ab342c7f55f
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
