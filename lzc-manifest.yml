application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:17d4f16c2d7c7ed07338ec53d6bf4224b8fe6388f4b10d705280d7a892a11b79
    image: ghcr.io/christian-gennari/nostos:latest@sha256:17d4f16c2d7c7ed07338ec53d6bf4224b8fe6388f4b10d705280d7a892a11b79
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
