application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:89492c862cf5bacfcd7baf5fb54de2532a345a53ce548dc23d064a860f181d8e
    image: ghcr.io/christian-gennari/nostos:latest@sha256:89492c862cf5bacfcd7baf5fb54de2532a345a53ce548dc23d064a860f181d8e
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
