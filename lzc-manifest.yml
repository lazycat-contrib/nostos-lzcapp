application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:6519e078db811e511b12438bb2d2bb2be3ed550a63ad2b7630f0758ffbf43b8e
    image: ghcr.io/christian-gennari/nostos:latest@sha256:6519e078db811e511b12438bb2d2bb2be3ed550a63ad2b7630f0758ffbf43b8e
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
