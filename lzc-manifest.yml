application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:5849ec0c8e33cbf3f173618ca51439cefef1d852cdec629a8c18ee1fe1534e00
    image: ghcr.io/christian-gennari/nostos:latest@sha256:5849ec0c8e33cbf3f173618ca51439cefef1d852cdec629a8c18ee1fe1534e00
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
