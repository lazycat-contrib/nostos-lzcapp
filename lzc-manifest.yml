application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/

services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    image: ghcr.io/christian-gennari/nostos@sha256:566b33afca98c1794ad8d070812f118ad761aa4e3e5f0ed851267ff0f1449e36
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
