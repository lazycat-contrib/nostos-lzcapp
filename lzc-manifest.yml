application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:dfa8ecc765fe74edf2c38eb414c71c60fc035ea50ecc526363afadf436c7ed09
    image: ghcr.io/christian-gennari/nostos:latest@sha256:dfa8ecc765fe74edf2c38eb414c71c60fc035ea50ecc526363afadf436c7ed09
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
