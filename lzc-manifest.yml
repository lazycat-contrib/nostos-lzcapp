application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:0462fab681c1a6d1e138bdaebde644181b5b5230f8e5198894e6bf52ddf7640a
    image: ghcr.io/christian-gennari/nostos:latest@sha256:0462fab681c1a6d1e138bdaebde644181b5b5230f8e5198894e6bf52ddf7640a
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
