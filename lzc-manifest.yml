application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:1b7220c0af0a5c386a9e51996f7f6a1bdfc6808e6f7208a37ed53552dc8288d7
    image: ghcr.io/christian-gennari/nostos:latest@sha256:1b7220c0af0a5c386a9e51996f7f6a1bdfc6808e6f7208a37ed53552dc8288d7
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
