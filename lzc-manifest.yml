application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:0ea979743aa13132626e74465275b43434374b6292eeeea1204bae78bb32dffe
    image: ghcr.io/christian-gennari/nostos:latest@sha256:0ea979743aa13132626e74465275b43434374b6292eeeea1204bae78bb32dffe
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
