application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:964b8cb846279e6b28e530cac59cd7c471dae6777de90207982f4ae6fbb29b6e
    image: ghcr.io/christian-gennari/nostos:latest@sha256:964b8cb846279e6b28e530cac59cd7c471dae6777de90207982f4ae6fbb29b6e
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
