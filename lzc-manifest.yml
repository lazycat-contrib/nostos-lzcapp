application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:f901a3955b8f12ec85c74d068939de51fd3bc8d13f13230a1ae9e86137fa77ab
    image: ghcr.io/christian-gennari/nostos:latest@sha256:f901a3955b8f12ec85c74d068939de51fd3bc8d13f13230a1ae9e86137fa77ab
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
