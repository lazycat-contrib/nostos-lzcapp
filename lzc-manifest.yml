application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:227470b5c85ec43f6a0e5ec2a81715661d3156430c945b27c85e3b83cc09d7dc
    image: ghcr.io/christian-gennari/nostos:latest@sha256:227470b5c85ec43f6a0e5ec2a81715661d3156430c945b27c85e3b83cc09d7dc
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
