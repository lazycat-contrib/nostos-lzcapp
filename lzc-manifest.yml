application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:3e394977a43115e0a7e4809c9cd86cb906d08d3dda036df1347d70276bb88d83
    image: ghcr.io/christian-gennari/nostos:latest@sha256:3e394977a43115e0a7e4809c9cd86cb906d08d3dda036df1347d70276bb88d83
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
