application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:1fe1dd7238b46d36c062829373bf22b1485e078b812b3c75fb1f8d3ed1097938
    image: ghcr.io/christian-gennari/nostos:latest@sha256:1fe1dd7238b46d36c062829373bf22b1485e078b812b3c75fb1f8d3ed1097938
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
