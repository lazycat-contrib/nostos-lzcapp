application:
  subdomain: nostos
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nostos:8080/
services:
  nostos:
    # ghcr.io/christian-gennari/nostos:latest
    # upstream: ghcr.io/christian-gennari/nostos:latest@sha256:8764ebcfd977064b07a658efa5bde38dafb094c9f1b8e25fcb924f90b2171673
    image: ghcr.io/christian-gennari/nostos:latest@sha256:8764ebcfd977064b07a658efa5bde38dafb094c9f1b8e25fcb924f90b2171673
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataProtection__KeysPath=/data/keys
    binds:
      - /lzcapp/var/data:/data
